[package]
name = "pylibsql"
version = "0.1.11"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.2"
libsql = { version = "0.9.30", features = ["encryption"]  }
tokio = { version = "1.53.1", features = [ "rt-multi-thread" ] }
tracing-subscriber = "0.3.23"

[build-dependencies]
version_check = "0.9.5"
# used where logic has to be version/distribution specific, e.g. pypy
pyo3-build-config = { version = "0.29.2" }
